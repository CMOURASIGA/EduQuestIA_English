<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>
  
  <!-- Outer App Icon Frame with Soft Rounded Corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Glow behind the rocket -->
  <circle cx="256" cy="256" r="160" fill="#6366F1" opacity="0.15" filter="blur(20px)" />

  <!-- Stars in background -->
  <g fill="#FFFFFF">
    <!-- Star 1 -->
    <path d="M 120 100 Q 120 110 110 110 Q 120 110 120 120 Q 120 110 130 110 Q 120 110 120 100" opacity="0.9" />
    <!-- Star 2 -->
    <path d="M 400 140 Q 400 155 385 155 Q 400 155 400 170 Q 400 155 415 155 Q 400 155 400 140" opacity="0.8" />
    <!-- Star 3 -->
    <path d="M 150 380 Q 150 390 140 390 Q 150 390 150 400 Q 150 390 160 390 Q 150 390 150 380" opacity="0.7" />
    <!-- Star 4 -->
    <path d="M 380 390 Q 380 400 370 400 Q 380 400 380 410 Q 380 400 390 400 Q 380 400 380 390" opacity="0.9" />
  </g>

  <!-- Tiny dots stars -->
  <circle cx="80" cy="220" r="4" fill="#FFFFFF" opacity="0.5" />
  <circle cx="440" cy="280" r="3" fill="#FFFFFF" opacity="0.6" />
  <circle cx="260" cy="80" r="4" fill="#FFFFFF" opacity="0.4" />
  
  <!-- Space swoop / Orbit ring -->
  <path d="M 60 420 Q 256 340 452 220" stroke="#818CF8" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.3" />
  <path d="M 80 440 Q 256 370 432 260" stroke="#A5B4FC" stroke-width="4" stroke-dasharray="12 16" stroke-linecap="round" fill="none" opacity="0.25" />

  <!-- Rocket Group angled towards upper right -->
  <g transform="translate(120, 110) rotate(15, 136, 136)">
    <!-- Flame trail -->
    <path d="M 100 240 C 90 280 136 310 136 310 C 136 310 182 280 172 240 Z" fill="url(#flameGrad)" />
    <path d="M 115 240 C 110 265 136 285 136 285 C 136 285 162 265 157 240 Z" fill="#FDE047" />

    <!-- Left Wing -->
    <path d="M 60 210 C 60 250 90 260 100 240 L 100 160 Z" fill="#4F46E5" />
    
    <!-- Right Wing -->
    <path d="M 212 210 C 212 250 182 260 172 240 L 172 160 Z" fill="#4F46E5" />

    <!-- Rocket Main Body -->
    <path d="M 100 120 C 100 60 136 20 136 20 C 136 20 172 60 172 120 L 172 240 L 100 240 Z" fill="url(#rocketGrad)" />
    
    <!-- Rocket Nose Cone -->
    <path d="M 100 120 C 100 60 136 20 136 20 C 136 20 172 60 172 120 Z" fill="#EF4444" />
    
    <!-- Window Outer Rim -->
    <circle cx="136" cy="115" r="28" fill="#312E81" />
    <!-- Window Glass -->
    <circle cx="136" cy="115" r="22" fill="#38BDF8" />
    <!-- Window shine -->
    <path d="M 124 103 A 18 18 0 0 1 148 103" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" />
    
    <!-- Rocket Bottom Trim -->
    <path d="M 100 225 L 172 225 L 172 240 L 100 240 Z" fill="#64748B" />
    <path d="M 100 185 L 172 185 L 172 192 L 100 192 Z" fill="#EF4444" />
  </g>
</svg>
